[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-digit-ocr"
version = "0.1.0"
description = "OCR pipeline for Persian/Arabic-Indic digit CAPTCHAs: synthetic data generation, segmentation, CNN classification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "tensorflow>=2.13",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pandas>=2.0",
    "huggingface_hub>=0.20",
]

[project.scripts]
captcha-ocr = "src.predictor:main"

[tool.setuptools]
packages = ["src"]
include-package-data = true

[tool.setuptools.package-data]
src = ["../fonts/**/*.ttf", "../models/*.keras"]
